name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Unit tests (contracts + host)
        run: bun test packages/contracts apps/desktop
      - name: Typecheck
        run: bunx tsc -p packages/contracts && bunx tsc -p apps/desktop --noEmit || true

  # Electron 打包冒烟仅在 Windows 跑(DR-TS-05;daemon/ext 随 extraResources)
  package-smoke:
    name: electron build smoke (windows)
    runs-on: windows-latest
    if: github.event_name == 'push'
    needs: test
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Build renderer + daemon + shell
        working-directory: apps/desktop
        run: |
          bunx vite build
          bun run daemon:build
          bun run shell:build
      - name: electron-builder (dir)
        working-directory: apps/desktop
        run: bunx electron-builder --win --dir
